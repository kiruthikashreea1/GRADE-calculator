<html>
<head>
<title>Grade Calculator</title>
<style>

body {
  background-color: lightpink;
  font-family: Arial;
  text-align: center;
 }

input{
  background-color:white;
  padding:5px;
  border-radius:20px;
}

button {
 background-color:lightblue;
 padding: 10px;
 border-radius: 5px;
 }   
        
</style>
</head>

<body>
<h2>Grade Calculator</h2>
<input type="number" id="mark1" placeholder="Enter Mark 1"><br><br>
<input type="number" id="mark2" placeholder="Enter Mark 2"><br><br>
<input type="number" id="mark3" placeholder="Enter Mark 3"><br><br>
<input type="number" id="mark4" placeholder="Enter Mark 4"><br><br>
<input type="number" id="mark5" placeholder="Enter Mark 5"><br><br>
<button onclick="grade()">Calculate Grade</button>

<p id="result"></p>

<script>

 function grade() {
let m1=document.getElementById("mark1").value;
let m2=document.getElementById("mark2").value;
let m3=document.getElementById("mark3").value;
let m4=document.getElementById("mark4").value;
let m5=document.getElementById("mark5").value;

let total=Number(m1) + Number(m2) + Number(m3) + Number(m4) + Number(m5);
let average = total /5;


  let grade;
if (average >= 80) {
    grade="A";
}
 else if (average >= 50) {
  grade="B";
}        
else {
  grade="Fail";
} 

document.getElementById("result").innerHTML=
 "Total Marks: " + total + " / 500<br>"+
 "Average: " + average + "%<br>" +
  "Grade: " + grade;
 }
    

</script>
</body>
</html>
